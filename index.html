const Q=`Which of these is an ~i adjective?~oishii|kireina|shizukana|benrina~Delicious ends in -i and keeps it before desu.
Present negative of “samui desu” (it’s cold)?~samukunai desu|samui dewa arimasen|samukatta desu|samuku desu~Drop the -i, add -kunai.
Past affirmative of “oishii desu”?~oishikatta desu|oishikunai desu|oishii deshita|oishikunakatta desu~Drop -i, add -katta.
Past negative of “ookii desu”?~ookikunakatta desu|ookikatta desu|ookikunai deshita|ookii dewa arimasendeshita~-kunai + -katta = -kunakatta.
Before desu, “sukina” becomes…~suki|sukina|sukii|sukikunai~~na adjectives drop their na before desu.
Present negative of “heta desu”?~heta dewa arimasen|hetakunai desu|heta deshita|heta dewa arimasendeshita~~na adjectives use dewa arimasen.
Past affirmative of “majime desu”?~majime deshita|majimekatta desu|majime dewa arimasen|majime datta~~na adjectives use deshita for the past.
Past negative of “taihen desu”?~taihen dewa arimasendeshita|taihenkunakatta desu|taihen deshita|taihen dewa arimasen~Use dewa arimasen + deshita.
“Fuji-san wa takai desu” means…~Mt. Fuji is high.|Mt. Fuji is cold.|Mt. Fuji is quiet.|Mt. Fuji was high.~Takai = high (or expensive).
“Kino wa samukatta desu” means…~It was cold yesterday.|It is cold today.|It wasn’t cold yesterday.|It will be cold tomorrow.~Kino = yesterday; samukatta = was cold.
Which is a ~na adjective?~kireina|atarashii|chiisai|omoshiroi~Kireina (pretty) is ~na.
“Kino no pati wa nigiyaka ___.” (Yesterday’s party was lively.)~deshita|desu|katta desu|dewa arimasen~Past of a ~na adjective = deshita.
Which word means “quiet”?~shizukana|nigiyakana|hiroi|semai~Shizukana = quiet.
Nigiyakana means…~lively|famous|polite|various~
“Kireina kabin desu ne” means…~What a lovely vase!|The vase is broken.|I don’t like the vase.|Where is the vase?~Ne invites agreement.
The particle ne at the end of a sentence…~seeks agreement (“isn’t it?”)|marks the topic|marks the object|makes it past tense~
Before a noun, a ~na adjective…~keeps its na (shizukana resutoran)|drops its na|changes to -katta|changes to -kunai~Na is dropped only before desu/deshita.
Which pair are both ~na adjectives?~kirei and kirai|kirei and oishii|samui and kirai|takai and kirei~They end in -i but are ~na.
Karai means…~hot, spicy|sour|sweet|cold~
Which is the ~i adjective meaning “dangerous”?~abunai|kikenna|taisetsuna|iyana~Kikenna is the ~na one.
~te form of kakimasu (write)~kaite|kaitte|kaide|kakite~-ki → -ite.
~te form of kaimasu (buy)~katte|kaite|kainde|kaide~-i → -tte.
~te form of yomimasu (read)~yonde|yomite|yomitte|yoite~-mi → -nde.
~te form of tabemasu (eat)~tabete|tabette|tabende|tabeite~Regular II: drop masu, add te.
~te form of ikimasu (go)~itte|iite|inde|ikite~Iku is the exception.
~te form of kimasu (come)~kite|kitte|kuite|kimete~Irregular.
~te form of shimasu (do)~shite|shimete|shitte|shide~Irregular.
~te form of machimasu (wait)~matte|machite|mande|maite~-chi → -tte.
~te form of oshimasu (push)~oshite|oshitte|oshinde|oshiite~-shi → -shite.
~te form of misemasu (show)~misete|misette|misende|misite~Regular II.
~te form of tsukaimasu (use)~tsukatte|tsukaite|tsukande|tsukaete~-i → -tte.
~te form of nomimasu (drink)~nonde|nomite|nomitte|noite~-mi → -nde.
~te kudasai means…~please do ~|please don’t ~|I want to ~|I can ~~Polite request.
3-ji made ni uchi ni ___ kudasai. (Please deliver it.)~todokete|todokenai|todokemasu|todoke~Todokemasu → todokete.
Kyouto to Nara ni ___, furui o-tera o mimasu.~itte|ikimasu|ikanai|ikitai~Link actions with the ~te form.
Which pair cannot be joined with the ~te form?~a statement and a suggestion|two actions by the same subject|two present-tense actions|two past-tense actions~Mood and tense must match.
Why does “Rinda-san ga kimashita” use ga?~Linda is new information|Linda is the object|It shows possession|It shows the place~Once known, she takes wa.
~nai form of kakimasu~kakanai|kakenai|kakinai|kakuna~-ki → -ka + nai.
~nai form of kaimasu~kawanai|kaanai|kainai|kaenai~Verbs ending in u use wa.
~nai form of tabemasu~tabenai|tabanai|tabeanai|tabinai~Regular II: drop masu, add nai.
~nai form of kimasu~konai|kinai|kenai|kanai~Irregular.
~nai form of shimasu~shinai|sanai|shenai|shimenai~Irregular.
Koko de tabako o ___ kudasai. (Please don’t smoke here.)~suwanaide|suinaide|suimasende|sutte~Suimasu → suwanai + de.
If the vowel before ~nai is “a”, the verb is…~Regular I|Regular II|Irregular|an adjective~I or e means Regular II.
Which is a Regular II verb?~tabemasu|kakimasu|machimasu|kaerimasu~Kaerimasu → kaeranai, so Regular I.
Imasu is used for…~people and animals|buildings|trees|boxes~Arimasu is for things.
Hako no naka ni kitte ga ___. (There are stamps in the box.)~arimasu|imasu|imashita|imasen~Stamps are things.
Past negative of arimasu~arimasendeshita|arimashita|arimasen|imasendeshita~
“Banana ga suki desu” means…~I like bananas.|I eat bananas.|I buy bananas.|I peel bananas.~
“Ikitakunakatta desu” means…~(I) didn’t want to go.|(I) wanted to go.|(I) don’t want to go.|(I) want to go.~~tai inflects like an ~i adjective.`.trim().split('\n');
function b1(){const s=$('#p1');s.innerHTML='<h2>Multiple choice</h2><p class="ins">Pick an answer and the correct one is revealed right away.</p><button class="rs">Retake</button>';got[1].clear();tot[1]=Q.length;

shuf(op.map((x,j)=>[x,j==0])).forEach(([x,c])=>{const b=document.createElement('button');b.className='opt';b.textContent=x;b.dataset.c=c?1:'';
b.onclick=()=>{box.querySelectorAll('button').forEach(k=>{k.disabled=true;if(k.dataset.c)k.classList.add('ok')});if(!c)b.classList.add('no');else got[1].add(i);
fb.hidden=false;fb.className='fb '+(c?'g':'b');fb.textContent=(c?'✓ Correct. ':'✗ Not quite. The answer is “'+op[0]+'”. ')+(e||'');sc()};box.append(b)});s.append(d)});sc()}
const A=[['oishii','i'],['atsui','i'],['chiisai','i'],['omoshiroi','i'],['muzukashii','i'],['yasui','i'],['kirei','na'],['shizuka','na'],['heta','na'],['nigiyaka','na'],['benri','na'],['taihen','na']],
V=[['kaku','kaki'],['yomu','yomi'],['taberu','tabe'],['miru','mi'],['suru','shi'],['kuru','ki'],['matsu','machi'],['nomu','nomi'],['hanasu','hanashi'],['au','ai']],
fa=(w,t)=>{const b=w.slice(0,-1);return t=='i'?[w+' desu',b+'kunai desu',b+'katta desu',b+'kunakatta desu']:[w+' desu',w+' dewa arimasen',w+' deshita',w+' dewa arimasen deshita']},
fv=s=>[s+'masu',s+'masen',s+'mashita',s+'masendeshita'];
function b2(){const s=$('#p2');got[2].clear();let n=0;const G=[['Adjectives (~i and ~na): type each form, including desu / dewa arimasen',A.map(([w,t])=>[w+' ('+t+')',fa(w,t)])],['Verbs: type the polite (~masu) forms',V.map(([d,x])=>[d,fv(x)])]];
s.innerHTML='<h2>Identification</h2><p class="ins">Type an answer in a box, then press Enter or tap away: the correct answer is revealed right away and the box locks. “Reveal remaining” checks any boxes you skipped.</p>';
G.forEach(([h,rows])=>{let t='<h2>'+h+'</h2><div class="w"><table><tr><th>Word</th><th>Present affirmative</th><th>Present negative</th><th>Past affirmative</th><th>Past negative</th></tr>';
rows.forEach(([w,f])=>{t+='<tr><td><b>'+w+'</b></td>'+f.map(a=>'<td><input autocapitalize="off" autocomplete="off" spellcheck="false" data-a="'+a+'" data-i="'+(n++)+'"></td>').join('')+'</tr>'});
s.insertAdjacentHTML('beforeend',t+'</table></div>')});tot[2]=n;
s.insertAdjacentHTML('beforeend','<button class="go">Reveal remaining</button><button class="rs">Reset</button>');
const chk=i=>{if(i.readOnly)return;const ok=norm(i.value)==norm(i.dataset.a);i.className=ok?'ok':'no';i.readOnly=true;got[2][ok?'add':'delete'](i.dataset.i);const p=i.parentNode;p.insertAdjacentHTML('beforeend',ok?'<small style="color:var(--ok)">✓ Correct</small>':'<small>✗ '+i.dataset.a+'</small>');sc()};
s.querySelectorAll('input').forEach(i=>{i.onchange=()=>{if(i.value.trim())chk(i)};i.onkeydown=e=>{if(e.key=='Enter')i.blur()}});
s.querySelector('.go').onclick=()=>s.querySelectorAll('input').forEach(chk);
s.querySelector('.rs').onclick=b2;sc()}
const F=`#Verb Forms - QUIZ|Make the verb structures according to the required forms.
Masu - Present affirmative - Hanasu~Hanashimasu (話します)
Te - Hanasu~Hanashite (話して)
Nai - Hanasu~Hanasanai (話さない)
Tai Form - Present Affirmative - Hanasu~Hanashitai (話したい)
Masu Form - Past Affirmative - Hanasu~Hanashimashita (話しました)
Tai Form - Past Affirmative - Hanasu~Hanashitakatta (話したかった)
#I-adjective Quiz|Write the adjective words following the required conjugation of the given adjective
Chiisai (past affirmative)~Chiisakatta desu
Atarashii (present negative)~Atarashikunai desu
Atsui (past negative)~Atsukunakatta desu
Omoshiroi (past negative)~Omoshirokunakatta desu
Karai (present affirmative)~Karai desu
#Na- adjective Quiz|Please complete the sentences with the appropriate na~adjective. Take note of the words and phrases in parentheses.
Watashi no machi wa __________ . (quiet – shizuka - present affirmative)~shizuka desu
Tanaka-san wa __________ hito _______. (kind – shinsetsu - present affirmative)~shinsetsuna;desu
Kono heya wa __________ . (clean – kirei - present negative)~kirei dewa arimasen|kirei ja arimasen
Watashi no sensei wa __________ . (strict – kibishii -  present negative)~kibishikunai desu~Note: kibishii is an ~i adjective, so it takes -kunai.
Kinou no tesuto wa __________ . (easy – kantan - past affirmative)~kantan deshita
Kinou no party wa __________ . (lively – nigiyaka - past affirmative)~nigiyaka deshita
Kinou no heya wa __________ . (clean – kirei - past negative)~kirei dewa arimasendeshita|kirei ja arimasendeshita
Ano hotel wa __________ . (quiet – shizuka - past negative)~shizuka dewa arimasendeshita|shizuka ja arimasendeshita
Tokyo wa __________ machi ______. (famous – yuumei - present affirmative)~yuumeina;desu
Kono mise wa __________ . (convenient – benri - present affirmative)~benri desu`.split('\n'),
ex=x=>{const m=x.match(/^(.*?)\s*\((.*)\)$/);return m?[x,m[1],m[2]]:[x]};
function b3(){const s=$('#p3');got[3].clear();tot[3]=F.filter(l=>l[0]!='#').length;s.innerHTML='<h2>Final Quiz (additional)</h2><p class="ins">Type your answer in each item and press Check (or Enter).</p><button class="rs">Reset</button>';s.lastChild.onclick=b3;let k=0;
F.forEach(l=>{if(l[0]=='#'){const[h,i]=l.slice(1).split('|');s.insertAdjacentHTML('beforeend','<h2>'+h+'</h2><p class="ins">'+i+'</p>');return}
const id=k++,[t,a,note]=l.split('~'),parts=a.split(';'),d=document.createElement('div');d.className='card';
let h=t.replace(/_{3,}/g,'<input autocapitalize="off" autocomplete="off" spellcheck="false">');if(h==t)h+='<br><input autocapitalize="off" autocomplete="off" spellcheck="false">';
d.innerHTML='<div>'+h+'</div><button class="go">Check</button><div class="fb" hidden></div>';
const ins=d.querySelectorAll('input'),fb=d.querySelector('.fb'),go=d.querySelector('.go');
ins.forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')go.click()});
go.onclick=()=>{let all=true;ins.forEach((i,j)=>{const ok=parts[j].split('|').flatMap(ex).map(norm).includes(norm(i.value));i.className=ok?'ok':'no';if(!ok)all=false});
got[3][all?'add':'delete'](id);fb.hidden=false;fb.className='fb '+(all?'g':'b');fb.textContent=(all?'✓ Correct: ':'✗ Answer: ')+parts.map(p=>p.split('|')[0]).join(' … ')+(note?'  ('+note+')':'');sc()};s.append(d)});sc()}
const R=`#I-adjectives (~i)|Drop the final -i and add -kunai (not), -katta (was) or -kunakatta (was not), then desu.
Chiisai (small)~Kono heya wa chiisai desu.|This room is small.~Kono heya wa chiisakunai desu.|This room is not small.~Ano uchi wa chiisakatta desu.|That house was small.~Ano uchi wa chiisakunakatta desu.|That house was not small.
Atarashii (new)~Kono kuruma wa atarashii desu.|This car is new.~Kono kuruma wa atarashikunai desu.|This car is not new.~Watashi no kaban wa atarashikatta desu.|My bag was new.~Watashi no kaban wa atarashikunakatta desu.|My bag was not new.
Atsui (hot)~Kyou wa atsui desu.|Today is hot.~Kyou wa atsukunai desu.|Today is not hot.~Kinou wa atsukatta desu.|Yesterday was hot.~Kinou wa atsukunakatta desu.|Yesterday was not hot.
Omoshiroi (interesting)~Kono hon wa omoshiroi desu.|This book is interesting.~Kono hon wa omoshirokunai desu.|This book is not interesting.~Kinou no eiga wa omoshirokatta desu.|Yesterday’s movie was interesting.~Kinou no eiga wa omoshirokunakatta desu.|Yesterday’s movie was not interesting.
Karai (spicy)~Kono karee wa karai desu.|This curry is spicy.~Kono karee wa karakunai desu.|This curry is not spicy.~Kinou no ramen wa karakatta desu.|Yesterday’s ramen was spicy.~Kinou no ramen wa karakunakatta desu.|Yesterday’s ramen was not spicy.
Kibishii (strict)~Watashi no sensei wa kibishii desu.|My teacher is strict.~Watashi no sensei wa kibishikunai desu.|My teacher is not strict.~Mukashi no sensei wa kibishikatta desu.|My old teacher was strict.~Mukashi no sensei wa kibishikunakatta desu.|My old teacher was not strict.
#Na-adjectives (~na)|Drop the na before desu. Use dewa arimasen (not), deshita (was) and dewa arimasendeshita (was not).
Shizuka (quiet)~Watashi no machi wa shizuka desu.|My town is quiet.~Watashi no machi wa shizuka dewa arimasen.|My town is not quiet.~Ano hotel wa shizuka deshita.|That hotel was quiet.~Ano hotel wa shizuka dewa arimasendeshita.|That hotel was not quiet.
Shinsetsu (kind)~Tanaka-san wa shinsetsuna hito desu.|Mr. Tanaka is a kind person.~Tanaka-san wa shinsetsu dewa arimasen.|Mr. Tanaka is not kind.~Sensei wa shinsetsu deshita.|The teacher was kind.~Sensei wa shinsetsu dewa arimasendeshita.|The teacher was not kind.
Kirei (clean, pretty)~Kono heya wa kirei desu.|This room is clean.~Kono heya wa kirei dewa arimasen.|This room is not clean.~Kinou no heya wa kirei deshita.|Yesterday’s room was clean.~Kinou no heya wa kirei dewa arimasendeshita.|Yesterday’s room was not clean.
Kantan (easy)~Kono tesuto wa kantan desu.|This test is easy.~Kono tesuto wa kantan dewa arimasen.|This test is not easy.~Kinou no tesuto wa kantan deshita.|Yesterday’s test was easy.~Kinou no tesuto wa kantan dewa arimasendeshita.|Yesterday’s test was not easy.
Nigiyaka (lively)~Kono machi wa nigiyaka desu.|This town is lively.~Kono machi wa nigiyaka dewa arimasen.|This town is not lively.~Kinou no party wa nigiyaka deshita.|Yesterday’s party was lively.~Kinou no party wa nigiyaka dewa arimasendeshita.|Yesterday’s party was not lively.
Yuumei (famous)~Tokyo wa yuumeina machi desu.|Tokyo is a famous city.~Kono mise wa yuumei dewa arimasen.|This shop is not famous.~Ano resutoran wa yuumei deshita.|That restaurant was famous.~Ano resutoran wa yuumei dewa arimasendeshita.|That restaurant was not famous.
Benri (convenient)~Kono mise wa benri desu.|This shop is convenient.~Kono mise wa benri dewa arimasen.|This shop is not convenient.~Kono basu wa benri deshita.|This bus was convenient.~Kono basu wa benri dewa arimasendeshita.|This bus was not convenient.
#Verb (~masu forms)|Present: ~masu / ~masen. Past: ~mashita / ~masendeshita.
Hanasu (to speak, to talk)~Watashi wa tomodachi to hanashimasu.|I talk with my friend.~Watashi wa tomodachi to hanashimasen.|I don’t talk with my friend.~Kinou sensei to hanashimashita.|I talked with my teacher yesterday.~Kinou sensei to hanashimasendeshita.|I didn’t talk with my teacher yesterday.
+Hanasu: other forms from the Final Quiz~Yukkuri hanashite kudasai.|Please speak slowly.~Koko de hanasanaide kudasai.|Please don’t talk here.~Tanaka-san to hanashitai desu.|I want to talk with Mr. Tanaka.~Tanaka-san to hanashitakatta desu.|I wanted to talk with Mr. Tanaka.`.split('\n'),
L=['Present affirmative','Present negative','Past affirmative','Past negative'],L2=['~te form + kudasai','~nai form + de kudasai','~tai (present)','~tai (past)'];
function b4(){const s=$('#p4');s.innerHTML='<h2>Reviewer: sample sentences</h2><p class="ins">Study notes, not a quiz. Every word from the Final Quiz file is used in all four forms, with romaji and English.</p>';
R.forEach(l=>{if(l[0]=='#'){const[h,i]=l.slice(1).split('|');s.insertAdjacentHTML('beforeend','<h2>'+h+'</h2><p class="ins">'+i+'</p>');return}
const[h,...x]=l.split('~'),Z=h[0]=='+'?L2:L,d=document.createElement('div');d.className='card';
